<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0b10" />
    <meta
      name="description"
      content="Log a movie take in the moment after the credits."
    />
    <title>Just Watched</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <p class="eyebrow">Just Watched</p>
        <h1>What did you just finish?</h1>
        <p class="sub">Title, stars, one line. Then you’re done.</p>
      </header>

      <form id="log-form" class="sheet" autocomplete="off">
        <label class="field">
          <span>Movie</span>
          <input
            id="title"
            name="title"
            type="text"
            enterkeyhint="next"
            placeholder="Title"
            required
            autofocus
          />
        </label>

        <fieldset class="stars">
          <legend>Your take</legend>
          <div class="star-row" role="radiogroup" aria-label="Star rating">
            <button type="button" class="star" data-value="1" aria-label="1 star">★</button>
            <button type="button" class="star" data-value="2" aria-label="2 stars">★</button>
            <button type="button" class="star" data-value="3" aria-label="3 stars">★</button>
            <button type="button" class="star" data-value="4" aria-label="4 stars">★</button>
            <button type="button" class="star" data-value="5" aria-label="5 stars">★</button>
          </div>
          <input type="hidden" id="rating" name="rating" value="" required />
        </fieldset>

        <label class="field">
          <span>One line <em>(optional)</em></span>
          <input
            id="note"
            name="note"
            type="text"
            maxlength="120"
            enterkeyhint="done"
            placeholder="The one thing you’ll remember"
          />
        </label>

        <button type="submit" id="submit" class="save" disabled>Log it</button>
      </form>

      <section class="feed">
        <div class="feed-head">
          <h2>Your log</h2>
          <p id="count" class="count"></p>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty">Nothing logged yet. Capture the next movie before you forget it.</p>
      </section>
    </div>

    <p id="toast" class="toast" hidden></p>
    <script src="app.js"></script>
  </body>
</html>
